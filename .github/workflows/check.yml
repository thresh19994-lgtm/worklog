name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  # claude/news-* 브랜치의 PR은 src/content/news-*/ 안의 파일만 바꿀 수 있다.
  news-path-guard:
    name: news path guard
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/news-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 변경 경로 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")"
          echo "변경된 파일:"
          echo "$changed"
          bad="$(echo "$changed" | grep -Ev '^src/content/news-(game|ai)/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.md$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::claude/news-* 브랜치는 src/content/news-*/ 안의 .md 파일만 바꿀 수 있습니다. 허용 밖 파일:"
            echo "$bad"
            exit 1
          fi
          echo "경로 검사 통과"
